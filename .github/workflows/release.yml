# ساخت بسته نصب و به‌روزرسانی برای cPanel بدون SSH/Composer (مراحل ۹۵ و ۱۰۲).
# فقط دستی اجرا می‌شود: GitHub ← Actions ← Build release package ← Run workflow.
# خروجی: idea-lab-<نسخه>.zip در بخش Artifacts همان اجرا (بدون .env و تست، با
# manifest.json شامل SHA-256 هر فایل). SHA-256 کل بسته در خلاصه اجرا چاپ می‌شود.
name: Build release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'شماره نسخه، مثلاً 1.1.1 (ارقام فارسی و v ابتدایی هم پذیرفته می‌شود)'
        required: true
        type: string
      lite:
        description: 'بسته سبک بدون vendor (فقط اگر composer.lock تغییر نکرده باشد)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: idealab_test
          MARIADB_USER: idealab
          MARIADB_PASSWORD: localtest
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, openssl, curl, fileinfo, intl
          tools: composer:v2

      - name: Install dependencies (with dev, for tests)
        run: composer install --no-interaction --prefer-dist

      # نسخه پیش از آزمون‌ها بررسی می‌شود تا ورودی نادرست زود و با پیام روشن رد شود
      - name: Validate version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION=$(php artisan release:build "$VERSION_INPUT" --validate)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Run tests on MariaDB 11.4
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: idealab_test
          DB_USERNAME: idealab
          DB_PASSWORD: localtest
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Build production package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LITE: ${{ inputs.lite }}
        run: |
          rm .env
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          if [ "$LITE" = "true" ]; then FLAG=--lite; SUFFIX=-lite; else FLAG=; SUFFIX=; fi
          php artisan release:build "$VERSION" --output="dist/idea-lab-$VERSION$SUFFIX.zip" --commit="$GITHUB_SHA" $FLAG
          {
            echo "### idea-lab $VERSION$SUFFIX"
            echo ''
            echo 'SHA-256 (مقایسه با صفحه بررسی بسته در پنل):'
            echo '```'
            (cd dist && sha256sum *.zip)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: idea-lab-${{ steps.version.outputs.version }}${{ inputs.lite && '-lite' || '' }}
          path: dist/*.zip
          retention-days: 30
